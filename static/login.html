<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxtray Sales System - Login</title>
<style>
:root {
  --primary: #1e40af; --bg: #f1f5f9; --surface: #fff; --border: #e2e8f0;
  --text: #0f172a; --text-muted: #94a3b8; --radius: 12px;
  --font: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:var(--surface); border-radius:var(--radius); padding:40px; width:380px; border:1px solid var(--border); box-shadow:0 4px 24px rgba(0,0,0,.06); }
.logo { text-align:center; margin-bottom:28px; }
.logo img { height:42px; }
h2 { font-size:20px; font-weight:700; text-align:center; margin-bottom:24px; color:var(--text); }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:5px; }
.form-group input { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:var(--font); }
.form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px #dbeafe; }
.btn { width:100%; padding:10px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--font); margin-top:8px; }
.btn:hover { background:#1e3a8a; }
.error { color:#dc2626; font-size:12px; text-align:center; margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo"><img src="/static/logo.png" alt="Boxtray"></div>
  <h2>Boxtray Sales System</h2>
  <div class="form-group"><label>Username</label><input id="username" placeholder="Enter username" autofocus></div>
  <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()"></div>
  <button class="btn" onclick="login()">Sign In</button>
  <div class="error" id="error"></div>
</div>
<script>
async function login(){
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value;
  if(!u||!p) return;
  var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(function(res){return res.json();});
  if(r.error){document.getElementById('error').textContent=r.error;return;}
  window.location.href='/';
}
</script>
</body>
</html>
